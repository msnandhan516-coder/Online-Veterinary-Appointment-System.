{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found | VETNEST{% endblock %}

{% block content %}
<div class="content-card" style="text-align: center; max-width: 600px; margin: 40px auto; padding: 60px 40px;">
    <div style="font-family: var(--font-serif); font-size: 4.5rem; font-weight: 700; color: var(--color-accent); margin-bottom: 8px; line-height: 1;">404</div>
    <h2 style="font-family: var(--font-serif); font-size: 2rem; font-weight: 700; margin-bottom: 12px;">Category or Page Not Found</h2>
    <p style="color: var(--color-muted); margin-bottom: 30px; font-size: 0.95rem;">
        The service category or page you were looking for doesn't exist or has been moved.
    </p>
    <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
        <a href="{% url 'index' %}" class="btn-vetnest-orange">
            <span>Return to Home</span>
            <span class="arrow-circle">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </span>
        </a>
        <a href="{% url 'services' %}" class="btn-vetnest-outline">Browse All Services</a>
    </div>
</div>
{% endblock %}
