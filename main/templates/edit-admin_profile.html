{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Admin Profile | VetCare{% endblock %}

{% block content %}
<div class="content-card" style="max-width: 580px; margin: 30px auto;">
    <div class="card-header-styled">
        <div>
            <span class="section-tag" style="background: var(--primary-blue-light); color: var(--text-primary);">Security & Profile</span>
            <h1 class="card-heading">Edit Administrator Profile</h1>
            <p style="color: var(--text-secondary); font-size: 0.92rem; margin-top: 4px;">
                Administrator: <strong>@{{ user.username }}</strong>
            </p>
        </div>
        <a href="{% url 'admin_dashboard' %}" class="btn-pill-outline">&larr; Dashboard</a>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label">Admin Username</label>
            <input type="text" value="{{ user.username }}" class="form-control" style="background: #edf2f5; cursor: not-allowed;" readonly>
        </div>

        <div class="form-group">
            <label class="form-label">Email Address *</label>
            <input type="email" name="email" value="{{ user.email }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label class="form-label">Phone Number *</label>
            <input type="tel" name="phone" value="{{ user.phone }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label class="form-label">Change Password (leave blank to keep current)</label>
            <input type="password" name="password" placeholder="Enter new admin password" class="form-control">
        </div>

        <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px;">
            <a href="{% url 'admin_dashboard' %}" class="btn-pill-outline">Cancel</a>
            <button type="submit" class="btn-pill-dark">Save Admin Changes</button>
        </div>
    </form>
</div>
{% endblock %}
