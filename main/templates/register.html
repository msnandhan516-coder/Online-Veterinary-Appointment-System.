{% extends 'base.html' %}
{% load static %}

{% block title %}Create Account | VetCare Clinic{% endblock %}

{% block content %}
<div class="auth-wrapper" style="max-width: 540px;">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-logo-icon" style="margin: 0 auto 16px; width: 48px; height: 48px;">
                <svg viewBox="0 0 24 24">
                    <path d="M19 10.5h-5.5V5h-3v5.5H5v3h5.5V19h3v-5.5H19v-3z"/>
                </svg>
            </div>
            <h2>Register Account</h2>
            <p>Join VetCare to book appointments and track your pet's healthcare</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label class="form-label">Full Name *</label>
                    <input type="text" name="fullname" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Username *</label>
                    <input type="text" name="username" class="form-control" placeholder="johndoe" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label class="form-label">Email Address *</label>
                    <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number *</label>
                    <input type="tel" name="phone" pattern="[0-9]{10}" class="form-control" placeholder="10-digit phone" title="Enter exactly 10 digits" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" name="password" class="form-control" placeholder="Create password" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password *</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Register As</label>
                <select name="role" class="form-control" required>
                    <option value="user" selected>Pet Owner</option>
                    <option value="admin">Clinic Staff / Administrator</option>
                </select>
            </div>

            <div style="margin-top: 26px;">
                <button type="submit" class="btn-pill-dark" style="width: 100%; padding: 12px;">
                    Create My Account
                </button>
            </div>

            <div style="text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--text-secondary);">
                Already have an account? 
                <a href="{% url 'login' %}" style="color: var(--accent-cyan-dark); font-weight: 700; text-decoration: none;">
                    Sign In here
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
