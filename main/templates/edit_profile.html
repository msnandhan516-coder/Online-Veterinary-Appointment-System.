{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Profile | VetCare{% endblock %}

{% block content %}
<div class="content-card" style="max-width: 580px; margin: 30px auto;">
    <div class="card-header-styled">
        <div>
            <span class="section-tag">Account Settings</span>
            <h1 class="card-heading">Edit My Profile</h1>
        </div>
        <a href="{% url 'dashboard' %}" class="btn-pill-outline">&larr; Back to Dashboard</a>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" value="{{ user.username }}" class="form-control" style="background: #edf2f5; cursor: not-allowed;" readonly>
            <small style="color: var(--text-muted);">Username cannot be changed.</small>
        </div>

        <div class="form-group">
            <label class="form-label">Email Address *</label>
            <input type="email" name="email" value="{{ user.email }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label class="form-label">Phone Number *</label>
            <input type="tel" name="phone" value="{{ user.phone }}" class="form-control" pattern="[0-9]{10}" title="Enter exactly 10 digits" required>
        </div>

        <div class="form-group">
            <label class="form-label">New Password (or keep current)</label>
            <input type="password" name="password" value="{{ user.password }}" class="form-control" required>
        </div>

        <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px;">
            <a href="{% url 'dashboard' %}" class="btn-pill-outline">Cancel</a>
            <button type="submit" class="btn-pill-dark">Save Profile Changes</button>
        </div>
    </form>
</div>
{% endblock %}
