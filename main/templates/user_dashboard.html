<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <title>User Dashboard | Pet Clinic</title>
    <meta charset="utf-8">

    <!-- FAVICON -->
    <link rel="icon" href="{% static 'sbg/images/favicon.ico' %}">
    <link rel="shortcut icon" href="{% static 'sbg/images/favicon.ico' %}">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'sbg/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'sbg/css/ui.totop.css' %}">

    <!-- JS -->
    <script src="{% static 'sbg/js/jquery-1.7.min.js' %}"></script>
    <script src="{% static 'sbg/js/jquery.ui.totop.js' %}"></script>

    <script>
        $(function () {
            $().UItoTop({ easingType: 'easeOutQuart' });
        });
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
    // Force no back navigation after logout
    window.history.pushState(null, "", window.location.href);
    window.onpopstate = function () {
        window.location.href = "{% url 'login' %}";
    };
</script>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="block1">
    <div class="main">
        <header>
            <h1>
                <a class="logo" href="{% url 'index' %}">
                    Pet Clinic
                </a>
            </h1>
        </header>
    </div>
</div>



<!-- ================= DASHBOARD CONTENT ================= -->

<div class="block4">
    <div class="main">
        <section id="content">
            <div class="container_12">
                <div class="wrapper v_stripe">


                    <!-- DASHBOARD CARD -->
                    <article class="grid_12">

                        <div class="appointment-card">

                            <h2 class="ind">
                                <span>User</span> Dashboard
                            </h2>



                            <div class="card-body">

                                <p class="f_19" style="color:#000;">
                                    Welcome, <strong>{{ request.session.username }}</strong> 👋
                                </p>

                                <br>

                                <!-- ACTION BUTTONS -->
                                <div class="dashboard-actions">

                                    <button type="button" class="button"
                                        onclick="window.location.href='{% url 'create_appointment' %}'">
                                        Book Appointments
                                    </button>

                                    <button type="button" class="button"
                                        onclick="window.location.href='{% url 'appointments' %}'">
                                        My Appointments
                                    </button>

                                    <button type="button" class="button"
                                        onclick="window.location.href='{% url 'edit_profile' %}'">
                                        Edit Profile
                                    </button>

                                   <button type="button" class="button"
                                        onclick="window.location.href='{% url 'logout' %}'">
                                        Logout
                                    </button>

                                </div>

                                <br><br>


                                <!-- PROFILE SUMMARY -->
                                <div class="profile-preview">

                                    <h3 style="color:#000;"><b>My Profile</b></h3>

                                    <table>
                                        <tr>
                                            <td><strong>Username</strong></td>
                                            <td style="color:#000;">{{ request.session.username }}</td>
                                        </tr>

                                        <tr>
                                            <td><strong>Email</strong></td>
                                            <td style="color:#000;">{{ user.email }}</td>
                                        </tr>

                                        <tr>
                                            <td><strong>Phone</strong></td>
                                            <td style="color:#000;">{{ user.phone }}</td>
                                        </tr>
                                    </table>

                                </div>


                            </div>

                        </div>

                    </article>


                </div>
            </div>
        </section>
    </div>
</div>


<!-- ================= FOOTER ================= -->

<div class="main">
    <footer>
        Pet Clinic © 2026
        <img src="{% static 'sbg/images/heart.png' %}" alt="">
        <a href="#">Privacy Policy</a>
    </footer>
</div>

</body>
</html>
