{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found | VetCare{% endblock %}

{% block content %}
<div class="content-card" style="text-align: center; max-width: 600px; margin: 40px auto; padding: 60px 40px;">
    <div style="font-size: 4rem; font-weight: 800; color: var(--accent-cyan); margin-bottom: 12px; line-height: 1;">404</div>
    <h2 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 12px;">Category or Page Not Found</h2>
    <p style="color: var(--text-secondary); margin-bottom: 30px; font-size: 0.95rem;">
        The service category or page you were looking for doesn't exist or has been moved.
    </p>
    <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
        <a href="{% url 'index' %}" class="btn-pill-dark">Return to Home</a>
        <a href="{% url 'services' %}" class="btn-pill-outline">Browse All Services</a>
    </div>
</div>
{% endblock %}
