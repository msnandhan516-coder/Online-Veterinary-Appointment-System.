{% extends 'base.html' %}
{% load static %}

{% block title %}Sign In | VETNEST{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon-pill" style="margin: 0 auto 16px; width: 48px; height: 48px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c-1.66 0-3 1.34-3 3 0 1.66 1.34 3 3 3s3-1.34 3-3c0-1.66-1.34-3-3-3zm-6-4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-9.5-5c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm7 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
            </div>
            <h2>Sign In to VETNEST</h2>
            <p>Access your pet appointments or admin portal</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label class="form-label">Account Role</label>
                <select name="role" class="form-control" required>
                    <option value="">-- Choose Account Role --</option>
                    <option value="user" selected>Pet Owner (User)</option>
                    <option value="admin">Administrator / Clinic Staff</option>
                </select>
            </div>

            <div style="margin-top: 26px;">
                <button type="submit" class="btn-vetnest-orange" style="width: 100%; justify-content: center; padding: 10px;">
                    <span>Sign In</span>
                    <span class="arrow-circle">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </span>
                </button>
            </div>

            <div style="text-align: center; margin-top: 22px; font-size: 0.88rem; color: var(--color-muted);">
                Don't have an account yet? 
                <a href="{% url 'register' %}" style="color: var(--color-text); font-weight: 700; text-decoration: underline;">
                    Register here
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
