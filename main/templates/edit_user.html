{% extends 'base.html' %}
{% load static %}

{% block title %}Edit User Account | VetCare Admin{% endblock %}

{% block content %}
<div class="content-card" style="max-width: 580px; margin: 30px auto;">
    <div class="card-header-styled">
        <div>
            <span class="section-tag">Account Management</span>
            <h1 class="card-heading">Edit Client Profile</h1>
            <p style="color: var(--text-secondary); font-size: 0.92rem; margin-top: 4px;">
                User: <strong>@{{ user.username }}</strong>
            </p>
        </div>
        <a href="{% url 'admin_users' %}" class="btn-pill-outline">&larr; User Directory</a>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" value="{{ user.username }}" class="form-control" style="background: #edf2f5; cursor: not-allowed;" readonly>
        </div>

        <div class="form-group">
            <label class="form-label">Email Address *</label>
            <input type="email" name="email" value="{{ user.email }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label class="form-label">Phone Number *</label>
            <input type="tel" name="phone" value="{{ user.phone }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label class="form-label">New Password (leave blank to keep current)</label>
            <input type="password" name="password" placeholder="Enter new password if changing" class="form-control">
        </div>

        <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px;">
            <a href="{% url 'admin_users' %}" class="btn-pill-outline">Cancel</a>
            <button type="submit" class="btn-pill-dark">Update Client Account</button>
        </div>
    </form>
</div>
{% endblock %}
