<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>All Users | Admin</title>
    <link rel="stylesheet" href="{% static 'sbg/css/style.css' %}">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
    // Force no back navigation after logout
    window.history.pushState(null, "", window.location.href);
    window.onpopstate = function () {
        window.location.href = "{% url 'login' %}";
    };
</script>
</head>
<body>

<!-- ================= HEADER ================= -->
<div class="block1">
    <div class="main">
        <header>
            <h1>
                <a class="logo" href="{% url 'admin_dashboard' %}">
                    Admin Panel
                </a>
            </h1>
        </header>
    </div>
</div>

<!-- ================= CONTENT ================= -->
<div class="block4">
    <div class="main">
        <section id="content">
            <div class="container_12">
                <div class="wrapper v_stripe">

                    <article class="grid_12">

                        <!-- SAME CARD STYLE -->
                        <div class="appointment-card fade-anim">

                            <h2 class="ind">
                                <span>All</span> Users
                            </h2>

                            <table>
                                <thead>
                                    <tr>
                                        <th>Username</th>
                                        <th>Email</th>
                                        <th>Phone</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>

                                <tbody>
                                    {% for user in users %}
                                    <tr>
                                        <td>{{ user.username }}</td>
                                        <td>{{ user.email }}</td>
                                        <td>{{ user.phone }}</td>
                                        <td>
                                           <button type="button" class="button"
                                                onclick="window.location.href='{% url 'edit_user' user.id %}'">
                                                EDIT
                                           </button> |
                                            <button type="button" class="button"
                                                onclick="if(confirm('Are you sure you want to delete this user?')) { window.location.href='{% url 'delete_user' user.id %}'; }">
                                                Delete
                                            </button>
                                        </td>
                                    </tr>

                                    {% empty %}
                                    <tr>
                                        <td colspan="4">
                                            No users found.
                                        </td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>

                            <button type="button" class="button"
                                onclick="window.location.href='{% url 'admin_dashboard' %}'">
                                Back
                            </button>

                        </div>

                    </article>

                </div>
            </div>
        </section>
    </div>
</div>

</body>
</html>
