{% extends 'base.html' %}
{% load static %}

{% block title %}Sign In | VetCare Clinic{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-logo-icon" style="margin: 0 auto 16px; width: 48px; height: 48px;">
                <svg viewBox="0 0 24 24">
                    <path d="M19 10.5h-5.5V5h-3v5.5H5v3h5.5V19h3v-5.5H19v-3z"/>
                </svg>
            </div>
            <h2>Sign In to VetCare</h2>
            <p>Access your pet appointments or admin portal</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label class="form-label">Sign In As</label>
                <select name="role" class="form-control" required>
                    <option value="">-- Choose Account Role --</option>
                    <option value="user" selected>Pet Owner (User)</option>
                    <option value="admin">Administrator / Clinic Staff</option>
                </select>
            </div>

            <div style="margin-top: 26px;">
                <button type="submit" class="btn-pill-dark" style="width: 100%; padding: 12px;">
                    Sign In
                </button>
            </div>

            <div style="text-align: center; margin-top: 22px; font-size: 0.88rem; color: var(--text-secondary);">
                Don't have an account yet? 
                <a href="{% url 'register' %}" style="color: var(--accent-cyan-dark); font-weight: 700; text-decoration: none;">
                    Register here
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
