{% extends 'base.html' %}
{% load static %}

{% block title %}Register Account | VETNEST{% endblock %}

{% block content %}
<div class="auth-wrapper" style="max-width: 540px;">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon-pill" style="margin: 0 auto 16px; width: 48px; height: 48px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c-1.66 0-3 1.34-3 3 0 1.66 1.34 3 3 3s3-1.34 3-3c0-1.66-1.34-3-3-3zm-6-4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-9.5-5c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm7 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
            </div>
            <h2>Register Account</h2>
            <p>Join VETNEST to book appointments and track your pet's healthcare</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Full Name *</label>
                    <input type="text" name="fullname" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Username *</label>
                    <input type="text" name="username" class="form-control" placeholder="johndoe" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Email Address *</label>
                    <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number *</label>
                    <input type="tel" name="phone" pattern="[0-9]{10}" class="form-control" placeholder="10-digit phone" title="Enter exactly 10 digits" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" name="password" class="form-control" placeholder="Create password" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password *</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Register As</label>
                <select name="role" class="form-control" required>
                    <option value="user" selected>Pet Owner</option>
                    <option value="admin">Clinic Staff / Administrator</option>
                </select>
            </div>

            <div style="margin-top: 26px;">
                <button type="submit" class="btn-vetnest-orange" style="width: 100%; justify-content: center; padding: 10px;">
                    <span>Create My Account</span>
                    <span class="arrow-circle">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </span>
                </button>
            </div>

            <div style="text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--color-muted);">
                Already have an account? 
                <a href="{% url 'login' %}" style="color: var(--color-text); font-weight: 700; text-decoration: underline;">
                    Sign In here
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
