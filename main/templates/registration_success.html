<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <title>Registration Successful | Pet Clinic</title>
    <meta charset="utf-8">

    <!-- FAVICON -->
    <link rel="icon" href="{% static 'sbg/images/favicon.ico' %}">
    <link rel="shortcut icon" href="{% static 'sbg/images/favicon.ico' %}">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'sbg/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'sbg/css/ui.totop.css' %}">

    <!-- JS -->
    <script src="{% static 'sbg/js/jquery-1.7.min.js' %}"></script>
    <script src="{% static 'sbg/js/jquery.ui.totop.js' %}"></script>

    <script>
        $(function () {
            $().UItoTop({ easingType: 'easeOutQuart' });
        });
    </script>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="block1">
    <div class="main">
        <header>
            <h1>
                <a class="logo" href="{% url 'index' %}">
                    Pet Clinic
                </a>
            </h1>
        </header>
    </div>
</div>

<!-- ================= NAVIGATION ================= -->
<div class="block2">
    <div class="main">
        <nav>
            <ul class="sf-menu">
                <li><a href="{% url 'index' %}">Home</a></li>
                <li class="current"><a href="#">Success</a></li>
                <li><a href="{% url 'login' %}">Login</a></li>
            </ul>
            <div class="clear"></div>
        </nav>
    </div>
</div>

<!-- ================= SUCCESS CONTENT ================= -->
<div class="block4">
    <div class="main">
        <section id="content">
            <div class="container_12">
                <div class="wrapper v_stripe">

                    <article class="grid_12">

                        <!-- ✅ CARD STYLE -->
                        <div class="appointment-card fade-anim" style="text-align:center;">

                            <h2 class="ind">
                                <span>Registration</span> Successful 🎉
                            </h2>

                            <p class="f_19" style="color:#000;">
                                Your account has been created successfully.
                            </p>

                            <p style="color:#000;">
                                You can now log in and book appointments for your pets.
                            </p>

                            <br>

                            <button type="button" class="button"
                                onclick="window.location.href='{% url 'login' %}'">
                                Go to Login
                            </button>

                        </div>

                    </article>

                </div>
            </div>
        </section>
    </div>
</div>

<!-- ================= FOOTER ================= -->
<div class="main">
    <footer>
        Pet Clinic © 2026
        <img src="{% static 'sbg/images/heart.png' %}" alt="">
        <a href="#">Privacy Policy</a>
    </footer>
</div>

</body>
</html>
